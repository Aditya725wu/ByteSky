services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/bytesky}
      JWT_SECRET: ${JWT_SECRET:-replace_this_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: debug
      TRUST_PROXY: "true"
      CONTAINER_IMAGE: ${CONTAINER_IMAGE:-nginx:alpine}
      CONTAINER_INTERNAL_PORT: ${CONTAINER_INTERNAL_PORT:-80}
      CONTAINER_PUBLIC_BASE_URL: ${CONTAINER_PUBLIC_BASE_URL:-http://localhost}
      CONTAINER_PORT_RANGE_START: ${CONTAINER_PORT_RANGE_START:-3001}
      CONTAINER_PORT_RANGE_END: ${CONTAINER_PORT_RANGE_END:-3099}
      MAX_CONTAINERS_PER_USER: ${MAX_CONTAINERS_PER_USER:-1}
      CONTAINER_TTL_MS: ${CONTAINER_TTL_MS:-1800000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ByteSky Cloud <no-reply@bytesky.cloud>}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    command: npm run dev
