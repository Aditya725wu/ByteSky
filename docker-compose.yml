services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 128m
    networks:
      - bytesky_edge
      - bytesky_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/bytesky}
      JWT_SECRET: ${JWT_SECRET:-replace_this_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@bytesky.cloud}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-ChangeMeImmediately!}
      ADMIN_SEED_NAME: System Administrator
      METRICS_ENABLED: "true"
      METRICS_INTERVAL_MS: 5000
      CONTAINER_IMAGE: ${CONTAINER_IMAGE:-nginx:alpine}
      CONTAINER_INTERNAL_PORT: ${CONTAINER_INTERNAL_PORT:-80}
      CONTAINER_PUBLIC_BASE_URL: ${CONTAINER_PUBLIC_BASE_URL:-http://localhost}
      VM_PUBLIC_BASE_URL: ${VM_PUBLIC_BASE_URL:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      CONTAINER_PORT_RANGE_START: ${CONTAINER_PORT_RANGE_START:-3001}
      CONTAINER_PORT_RANGE_END: ${CONTAINER_PORT_RANGE_END:-3099}
      MAX_CONTAINERS_PER_USER: ${MAX_CONTAINERS_PER_USER:-1}
      CONTAINER_TTL_MS: ${CONTAINER_TTL_MS:-1800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "5000"
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 512m
    networks:
      - bytesky_edge
      - bytesky_internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health/ready',(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    command: ["--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 768m
    networks:
      - bytesky_internal
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand(\"ping\").ok' | mongosh mongodb://127.0.0.1:27017/admin --quiet | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    networks:
      - bytesky_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  backend_logs:
  backend_uploads:

networks:
  bytesky_edge:
    driver: bridge
  bytesky_internal:
    driver: bridge
    internal: true
